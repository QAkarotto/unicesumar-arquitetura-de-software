openapi: 3.0.3
info:
  title: FoodNow API - Pedidos (contrato ATUAL)
  version: 1.0.0
  description: |
    Contrato atual das quatro operacoes de pedidos, ANTES da observacao.
    ATENCAO: reconstruido a partir do enunciado, sem acesso ao repositorio.
    Nomes de campos, codigos de erro e exemplos devem ser conferidos contra
    os DTOs e testes reais antes da entrega.
servers:
  - url: http://localhost:8080
paths:
  /pedidos:
    post:
      operationId: criarPedido
      summary: Cria um pedido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarPedidoRequest'
            example:
              clienteId: 10
              restauranteId: 3
              latitude: -25.095
              longitude: -50.161
      responses:
        '201':
          description: Pedido criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoResponse'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          description: Pedido fora da area de atendimento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
  /pedidos/{id}:
    get:
      operationId: consultarPedido
      summary: Consulta um pedido
      parameters:
        - $ref: '#/components/parameters/PedidoId'
      responses:
        '200':
          description: Pedido encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoResponse'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
  /pedidos/{id}/itens:
    post:
      operationId: adicionarItem
      summary: Adiciona um item ao pedido
      parameters:
        - $ref: '#/components/parameters/PedidoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemPedidoRequest'
            example:
              produtoId: 7
              quantidade: 2
      responses:
        '200':
          description: Item adicionado; retorna o pedido atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoResponse'
        '400':
          $ref: '#/components/responses/RequisicaoInvalida'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/EstadoInvalido'
  /pedidos/{id}/confirmar:
    post:
      operationId: confirmarPedido
      summary: Confirma o pedido
      parameters:
        - $ref: '#/components/parameters/PedidoId'
      responses:
        '200':
          description: Pedido confirmado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoResponse'
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '409':
          $ref: '#/components/responses/EstadoInvalido'
components:
  parameters:
    PedidoId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    RequisicaoInvalida:
      description: Corpo invalido ou campo violando validacao
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroResponse'
    NaoEncontrado:
      description: Recurso nao encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroResponse'
    EstadoInvalido:
      description: Operacao incompativel com o status atual do pedido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroResponse'
  schemas:
    CriarPedidoRequest:
      type: object
      required: [clienteId, restauranteId, latitude, longitude]
      properties:
        clienteId:
          type: integer
          format: int64
        restauranteId:
          type: integer
          format: int64
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
    ItemPedidoRequest:
      type: object
      required: [produtoId, quantidade]
      properties:
        produtoId:
          type: integer
          format: int64
        quantidade:
          type: integer
          minimum: 1
    ItemPedidoResponse:
      type: object
      properties:
        produtoId:
          type: integer
          format: int64
        quantidade:
          type: integer
        precoUnitario:
          type: number
    PedidoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum: [CRIADO, CONFIRMADO, PAGO, ENTREGUE, CANCELADO]
        clienteId:
          type: integer
          format: int64
        restauranteId:
          type: integer
          format: int64
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemPedidoResponse'
        subtotal:
          type: number
        taxaEntrega:
          type: number
        total:
          type: number
      example:
        id: 1
        status: CRIADO
        clienteId: 10
        restauranteId: 3
        itens: []
        subtotal: 0.0
        taxaEntrega: 6.98
        total: 6.98
    ErroResponse:
      type: object
      properties:
        status:
          type: integer
        mensagem:
          type: string
      example:
        status: 404
        mensagem: Pedido nao encontrado
