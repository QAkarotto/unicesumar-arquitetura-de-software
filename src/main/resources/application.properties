spring.application.name=foodnow
spring.datasource.url=jdbc:h2:mem:foodnow;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.jackson.default-property-inclusion=non_null
foodnow.pagamento.gateway.timeout=2s
foodnow.pagamento.gateway.tentativas=3
foodnow.pagamento.gateway.espera-inicial=200ms
