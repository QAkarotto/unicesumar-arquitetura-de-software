openapi: 3.1.0
info:
  title: FoodNow API - Contrato anterior
  version: 1.0.0
  description: >
    API antes das implementações solicitadas.
servers:
  - url: http://localhost:8080
paths:
  /pedidos:
    post:
      summary: Criar pedido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoRequest'
      responses:
        '201':
          description: Pedido criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleError'
  /pedidos/{id}:
    parameters:
      - $ref: '#/components/parameters/PedidoId'
    get:
      summary: Consultar pedido
      responses:
        '200':
          description: Pedido encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
  /pedidos/{id}/itens:
    parameters:
      - $ref: '#/components/parameters/PedidoId'
    post:
      summary: Adicionar item ao pedido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemPedidoRequest'
      responses:
        '200':
          description: Pedido atualizado com o novo item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleError'
  /pedidos/{id}/confirmar:
    parameters:
      - $ref: '#/components/parameters/PedidoId'
    post:
      summary: Confirmar pedido
      responses:
        '200':
          description: Pedido confirmado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleError'
components:
  parameters:
    PedidoId:
      name: id
      in: path
      required: true
      description: Identificador numérico do pedido.
      schema:
        type: integer
        format: int64
  schemas:
    PedidoRequest:
      type: object
      required:
        - clienteId
        - restauranteId
        - enderecoEntregaId
        - itens
      properties:
        clienteId:
          type: integer
          format: int64
          description: Obrigatório e não nulo.
        restauranteId:
          type: integer
          format: int64
          description: Obrigatório e não nulo.
        enderecoEntregaId:
          type: integer
          format: int64
          description: Obrigatório e não nulo; deve pertencer ao cliente.
        itens:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ItemPedidoRequest'
    ItemPedidoRequest:
      type: object
      required:
        - produtoId
        - quantidade
      properties:
        produtoId:
          type: integer
          format: int64
          description: Obrigatório e não nulo.
        quantidade:
          type: integer
          minimum: 1
    ItemResponse:
      type: object
      required:
        - produtoId
        - nome
        - quantidade
        - precoUnitario
        - subtotal
      properties:
        produtoId:
          type: integer
          format: int64
        nome:
          type: string
        quantidade:
          type: integer
        precoUnitario:
          type: number
        subtotal:
          type: number
    PedidoResponse:
      type: object
      required:
        - id
        - clienteId
        - restauranteId
        - enderecoEntregaId
        - itens
        - subtotal
        - taxaEntrega
        - valorTotal
        - distanciaEntregaKm
        - status
      properties:
        id:
          type: integer
          format: int64
        clienteId:
          type: integer
          format: int64
        restauranteId:
          type: integer
          format: int64
        enderecoEntregaId:
          type: integer
          format: int64
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemResponse'
        subtotal:
          type: number
        taxaEntrega:
          type: number
        valorTotal:
          type: number
        distanciaEntregaKm:
          type: number
        status:
          type: string
          enum:
            - CRIADO
            - CONFIRMADO
            - PAGO
            - PAGAMENTO_REJEITADO
            - EM_ENTREGA
            - ENTREGUE
    ErroResponse:
      type: object
      required:
        - status
        - erro
        - mensagem
      properties:
        status:
          type: integer
        erro:
          type: string
        mensagem:
          type: string
  responses:
    ValidationError:
      description: Requisição inválida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroResponse'
    NotFound:
      description: Pedido, cliente, restaurante ou produto não encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroResponse'
    BusinessRuleError:
      description: Regra de negócio não atendida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroResponse'
