openapi: 3.0.3
info:
  title: FoodNow - pedidos com observacao opcional
  version: 1.1.0-after
  description: |
    Contrato apos a inclusao da observacao opcional na branch 8sfelipe-atividade01-2bim.
    A versao deste documento nao cria uma versao de rota da API.
    Fontes em src/main: PedidoController, ApiDtos, ObservacaoDeserializer,
    ApiExceptionHandler, PedidoService, Pedido, ItemPedido e StatusPedido.
    Os corpos aqui representados usam JSON, conforme os testes RestAssured;
    o controller nao declara restricoes explicitas de consumes ou produces.
    A configuracao principal declara non_null. Adicionalmente, a propriedade
    observacao de PedidoResponse possui @JsonInclude(NON_NULL), garantindo sua
    omissao quando nula inclusive no contexto de testes. Vazio e espacos sao
    preservados. As demais propriedades de referencia seguem a configuracao
    global; no fluxo normal todos os campos anteriores sao preenchidos.
    Erros de Bean Validation usam ErroResponse; erros de leitura JSON e conversao
    de parametros ficam a cargo do Spring MVC, sem garantia desse corpo.
    Nao ha politica nova para propriedades JSON desconhecidas.
paths:
  /pedidos:
    post:
      operationId: criarPedido
      summary: Criar pedido com itens
      description: |
        PedidoController.criar -> PedidoService.criar. Carrega cliente e
        restaurante, verifica o vínculo do endereço com o cliente, cota a
        entrega, adiciona os itens e persiste o pedido com status CRIADO.
        A cotação considera também o endereço principal do cliente.
        Não há cabeçalho Location construído explicitamente.

        Recebe observacao opcional somente na criacao; persiste sem normalizacao.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoRequest'
            example:
              clienteId: 1
              restauranteId: 1
              enderecoEntregaId: 1
              itens:
              - produtoId: 1
                quantidade: 2
              observacao: Nao incluir talheres
      responses:
        '201':
          description: Pedido criado e persistido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoResponse'
              example:
                id: 1
                clienteId: 1
                restauranteId: 1
                enderecoEntregaId: 1
                itens:
                - produtoId: 1
                  nome: Pizza
                  quantidade: 2
                  precoUnitario: 30.0
                  subtotal: 60.0
                subtotal: 60.0
                taxaEntrega: 6.55
                valorTotal: 66.55
                distanciaEntregaKm: 1.515000000000093
                status: CRIADO
                observacao: Nao incluir talheres
        '400':
          $ref: '#/components/responses/ValidacaoOuLeituraInvalida'
        '404':
          description: Cliente, restaurante ou produto não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                status: 404
                erro: NOT_FOUND
                mensagem: Cliente não encontrado
        '422':
          description: |
            Regra de negócio violada. Mensagens explícitas: Endereço não
            pertence ao cliente; Endereço fora da área de entrega;
            Produto indisponível seguido do nome; Produto não pode ser
            entregue no endereço selecionado; Produto pertence a outro
            restaurante. IllegalArgumentException e IllegalStateException
            também são convertidas em 422 pelo handler global.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                status: 422
                erro: REGRA_NEGOCIO
                mensagem: Endereço fora da área de entrega
  /pedidos/{id}:
    parameters:
    - $ref: '#/components/parameters/PedidoId'
    get:
      operationId: consultarPedido
      summary: Consultar pedido
      description: PedidoController.consultar -> PedidoService.consultar -> PedidoRepository.findById.
      responses:
        '200':
          $ref: '#/components/responses/PedidoRetornado'
        '400':
          $ref: '#/components/responses/ParametroInvalido'
        '404':
          $ref: '#/components/responses/PedidoNaoEncontrado'
  /pedidos/{id}/itens:
    parameters:
    - $ref: '#/components/parameters/PedidoId'
    post:
      operationId: adicionarItemPedido
      summary: Adicionar uma linha de item ao pedido
      description: |
        PedidoController.adicionarItem -> PedidoService.adicionarItem.
        Verifica existência e disponibilidade do produto, possibilidade de
        entrega e pertencimento ao restaurante do pedido. Acrescenta uma
        nova linha, mesmo para produto repetido, recalcula subtotal e total
        e salva. Não verifica o status do pedido nem refaz a cotação ou o
        adicional logístico calculado na criação.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemPedidoRequest'
            example:
              produtoId: 1
              quantidade: 1
      responses:
        '200':
          $ref: '#/components/responses/PedidoRetornado'
        '400':
          $ref: '#/components/responses/ValidacaoOuLeituraInvalida'
        '404':
          description: Pedido ou produto não encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                status: 404
                erro: NOT_FOUND
                mensagem: Produto não encontrado
        '422':
          description: |
            Produto indisponível (mensagem inclui o nome), produto não pode
            ser entregue no endereço selecionado ou pertence a outro
            restaurante. Quantidade deve ser positiva é uma proteção do
            domínio; a entrada HTTP com quantidade menor que 1 é rejeitada
            antes pela validação do DTO com 400.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                status: 422
                erro: REGRA_NEGOCIO
                mensagem: Produto pertence a outro restaurante
  /pedidos/{id}/confirmar:
    parameters:
    - $ref: '#/components/parameters/PedidoId'
    post:
      operationId: confirmarPedido
      summary: Confirmar pedido
      description: |
        PedidoController.confirmar -> PedidoService.confirmar ->
        Pedido.confirmar. Não declara corpo de requisição. Exige ao menos
        um item e status CRIADO; altera para CONFIRMADO, chama
        NotificacaoService.notificarConfirmacao e salva.
      responses:
        '200':
          $ref: '#/components/responses/PedidoRetornado'
        '400':
          $ref: '#/components/responses/ParametroInvalido'
        '404':
          $ref: '#/components/responses/PedidoNaoEncontrado'
        '422':
          description: |
            Pedido deve possuir ao menos um item; ou Apenas pedidos criados
            podem ser confirmados. A confirmação não é idempotente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroResponse'
              example:
                status: 422
                erro: REGRA_NEGOCIO
                mensagem: Apenas pedidos criados podem ser confirmados
components:
  parameters:
    PedidoId:
      name: id
      in: path
      required: true
      description: Identificador Long do pedido. Não há validação de positividade declarada.
      schema:
        type: integer
        format: int64
  responses:
    PedidoRetornado:
      description: Representação do pedido após a operação, com o status atual.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PedidoResponse'
    PedidoNaoEncontrado:
      description: Pedido não encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroResponse'
          example:
            status: 404
            erro: NOT_FOUND
            mensagem: Pedido não encontrado
    ParametroInvalido:
      description: |
        Falha de conversão de id para Long pelo Spring MVC. Não há handler
        específico na aplicação; o formato do corpo não é especificado.
    ValidacaoOuLeituraInvalida:
      description: |
        Falha de Bean Validation gera ErroResponse com erro VALIDATION_ERROR
        e mensagem do primeiro erro de campo no formato campo seguida de
        dois-pontos e mensagem da validação. O texto depende do provedor e
        locale. Corpo ausente, JSON ilegível ou parâmetro de rota inválido
        são tratados pelo framework, sem garantia desse schema de erro.

        Observacao acima de 500 pontos de codigo Unicode gera 400 VALIDATION_ERROR. Tipos JSON diferentes de string e null geram 400 de leitura pelo framework.
      content:
        application/json:
          schema:
            description: |
              Para Bean Validation, o corpo segue ErroResponse. O schema
              permanece aberto porque os outros casos de 400 são tratados
              pelo framework sem contrato de corpo definido na aplicação.
          examples:
            validacao:
              summary: Exemplo de validação com mensagem em inglês
              value:
                status: 400
                erro: VALIDATION_ERROR
                mensagem: 'itens: must not be empty'
  schemas:
    PedidoRequest:
      type: object
      description: ApiDtos.PedidoRequest, validado por @Valid no controller.
      required:
      - clienteId
      - restauranteId
      - enderecoEntregaId
      - itens
      properties:
        clienteId:
          type: integer
          format: int64
          description: Obrigatório e não nulo (@NotNull), sem validação de positividade.
        restauranteId:
          type: integer
          format: int64
          description: Obrigatório e não nulo (@NotNull), sem validação de positividade.
        enderecoEntregaId:
          type: integer
          format: int64
          description: Obrigatório e não nulo (@NotNull); deve pertencer ao cliente.
        itens:
          type: array
          minItems: 1
          description: |
            @NotEmpty rejeita ausência, null e lista vazia. @Valid valida
            os DTOs presentes. Não há @NotNull nos elementos; um elemento
            null não é rejeitado por essa anotação e pode causar falha não
            tratada ao ser acessado pelo controller. Não é um item utilizável.
          items:
            $ref: '#/components/schemas/ItemPedidoRequest'
        observacao:
          type: string
          nullable: true
          maxLength: 500
          description: 'Opcional, @CodePointLength(max = 500). Ausencia e null sao armazenados como null; vazio e
            espacos sao preservados sem trim. Somente texto ou null: numeros, booleanos, objetos e arrays
            geram HTTP 400 de leitura, sem garantia de ErroResponse. O limite conta pontos de codigo Unicode,
            sem normalizacao; um caractere suplementar conta como um ponto de codigo.'
          example: Nao incluir talheres
    ItemPedidoRequest:
      type: object
      required:
      - produtoId
      - quantidade
      description: |
        ApiDtos.ItemPedidoRequest. produtoId possui @NotNull. quantidade é
        int primitivo com @Min(1); omiti-la não produz uma quantidade válida.
        Não há política explícita no código para coerção de null em primitivos.
      properties:
        produtoId:
          type: integer
          format: int64
          description: Não nulo; sem validação de positividade declarada.
        quantidade:
          type: integer
          format: int32
          minimum: 1
    PedidoResponse:
      type: object
      description: |
        ApiDtos.PedidoResponse.from. Campos anteriores normalmente preenchidos.
        Observacao opcional, mantida nas quatro operacoes. @JsonInclude(NON_NULL)
        omite apenas essa propriedade se seu valor for null, inclusive nos testes.
        As demais referencias nulas seguem a configuracao global non_null principal.
      required:
      - distanciaEntregaKm
      properties:
        id:
          type: integer
          format: int64
        clienteId:
          type: integer
          format: int64
        restauranteId:
          type: integer
          format: int64
        enderecoEntregaId:
          type: integer
          format: int64
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemResponse'
        subtotal:
          type: number
          description: BigDecimal; soma dos subtotais, arredondada a duas casas com HALF_UP.
        taxaEntrega:
          type: number
          description: BigDecimal; cotação base mais adicional dos itens na criação.
        valorTotal:
          type: number
          description: BigDecimal; subtotal mais taxaEntrega, arredondado a duas casas com HALF_UP.
        distanciaEntregaKm:
          type: number
          format: double
        status:
          type: string
          enum:
          - CRIADO
          - CONFIRMADO
          - PAGO
          - PAGAMENTO_REJEITADO
          - EM_ENTREGA
          - ENTREGUE
        observacao:
          type: string
          maxLength: 500
          description: Persistida somente na criacao, sem edicao posterior. Null e omitido; vazio retorna
            string vazia. Limite de 500 pontos de codigo Unicode, sem normalizacao.
          example: Nao incluir talheres
    ItemResponse:
      type: object
      description: |
        ApiDtos.ItemResponse.from. Referências null são omitidas (non_null).
        Não expõe o id da entidade ItemPedido. Não há validações de saída
        por Bean Validation; quantidade positiva é uma regra do domínio.
      required:
      - quantidade
      properties:
        produtoId:
          type: integer
          format: int64
        nome:
          type: string
        quantidade:
          type: integer
          format: int32
        precoUnitario:
          type: number
          description: BigDecimal; preço do produto capturado ao criar o item.
        subtotal:
          type: number
          description: BigDecimal; precoUnitario multiplicado por quantidade.
    ErroResponse:
      type: object
      description: |
        ApiDtos.ErroResponse produzido pelo ApiExceptionHandler. status e
        erro são preenchidos pelos handlers. mensagem usa a mensagem da
        exceção ou o primeiro erro de validação; se null, é omitida.
      required:
      - status
      - erro
      properties:
        status:
          type: integer
          format: int32
          enum:
          - 400
          - 404
          - 422
        erro:
          type: string
          enum:
          - VALIDATION_ERROR
          - NOT_FOUND
          - REGRA_NEGOCIO
        mensagem:
          type: string
