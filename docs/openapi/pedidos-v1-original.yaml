
openapi: 3.0.3

info:
  title: FoodNow - API de Pedidos
  description: >
    Especificação do contrato original das operações de pedidos,
    antes da inclusão do campo opcional observacao.
  version: 1.0.0

tags:
  - name: Pedidos
    description: Operações de criação, consulta, atualização de itens e confirmação de pedidos.

paths:
  /pedidos:
    post:
      tags:
        - Pedidos
      summary: Criar pedido
      operationId: criarPedido
      description: Cria um pedido com cliente, restaurante, endereço e itens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoRequest'
            example:
              clienteId: 1
              restauranteId: 1
              enderecoEntregaId: 1
              itens:
                - produtoId: 1
                  quantidade: 2
      responses:
        '201':
          description: Pedido criado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoResponse'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '404':
          $ref: '#/components/responses/RecursoNaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraNegocio'

  /pedidos/{id}:
    get:
      tags:
        - Pedidos
      summary: Consultar pedido
      operationId: consultarPedido
      description: Recupera os dados de um pedido pelo identificador.
      parameters:
        - $ref: '#/components/parameters/PedidoId'
      responses:
        '200':
          description: Pedido encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoResponse'
        '404':
          $ref: '#/components/responses/RecursoNaoEncontrado'

  /pedidos/{id}/itens:
    post:
      tags:
        - Pedidos
      summary: Adicionar item ao pedido
      operationId: adicionarItemPedido
      description: Adiciona um produto ao pedido existente.
      parameters:
        - $ref: '#/components/parameters/PedidoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemPedidoRequest'
            example:
              produtoId: 2
              quantidade: 1
      responses:
        '200':
          description: Item adicionado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoResponse'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '404':
          $ref: '#/components/responses/RecursoNaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraNegocio'

  /pedidos/{id}/confirmar:
    post:
      tags:
        - Pedidos
      summary: Confirmar pedido
      operationId: confirmarPedido
      description: Confirma um pedido que possui pelo menos um item e está no status CRIADO.
      parameters:
        - $ref: '#/components/parameters/PedidoId'
      responses:
        '200':
          description: Pedido confirmado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoResponse'
        '404':
          $ref: '#/components/responses/RecursoNaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraNegocio'

components:
  parameters:
    PedidoId:
      name: id
      in: path
      required: true
      description: Identificador numérico do pedido.
      schema:
        type: integer
        format: int64

  schemas:
    PedidoRequest:
      type: object
      required:
        - clienteId
        - restauranteId
        - enderecoEntregaId
        - itens
      properties:
        clienteId:
          type: integer
          format: int64
          description: Identificador do cliente.
        restauranteId:
          type: integer
          format: int64
          description: Identificador do restaurante.
        enderecoEntregaId:
          type: integer
          format: int64
          description: Identificador do endereço de entrega pertencente ao cliente.
        itens:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ItemPedidoRequest'

    ItemPedidoRequest:
      type: object
      required:
        - produtoId
        - quantidade
      properties:
        produtoId:
          type: integer
          format: int64
          description: Identificador do produto.
        quantidade:
          type: integer
          minimum: 1
          description: Quantidade solicitada do produto.

    ItemResponse:
      type: object
      required:
        - produtoId
        - nome
        - quantidade
        - precoUnitario
        - subtotal
      properties:
        produtoId:
          type: integer
          format: int64
        nome:
          type: string
        quantidade:
          type: integer
        precoUnitario:
          type: number
        subtotal:
          type: number

    PedidoResponse:
      type: object
      required:
        - id
        - clienteId
        - restauranteId
        - enderecoEntregaId
        - itens
        - subtotal
        - taxaEntrega
        - valorTotal
        - distanciaEntregaKm
        - status
      properties:
        id:
          type: integer
          format: int64
        clienteId:
          type: integer
          format: int64
        restauranteId:
          type: integer
          format: int64
        enderecoEntregaId:
          type: integer
          format: int64
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemResponse'
        subtotal:
          type: number
        taxaEntrega:
          type: number
        valorTotal:
          type: number
        distanciaEntregaKm:
          type: number
        status:
          $ref: '#/components/schemas/StatusPedido'

    StatusPedido:
      type: string
      enum:
        - CRIADO
        - CONFIRMADO
        - PAGO
        - PAGAMENTO_REJEITADO
        - EM_ENTREGA
        - ENTREGUE

    ErroResponse:
      type: object
      required:
        - status
        - erro
        - mensagem
      properties:
        status:
          type: integer
        erro:
          type: string
          description: Código identificador do erro.
          enum:
            - VALIDATION_ERROR
            - NOT_FOUND
            - REGRA_NEGOCIO
        mensagem:
          type: string

  responses:
    ErroValidacao:
      description: Erro de validação dos dados enviados.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroResponse'

    RecursoNaoEncontrado:
      description: Pedido, cliente, restaurante ou produto não encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroResponse'

    RegraNegocio:
      description: Operação não permitida pelas regras de negócio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroResponse'
