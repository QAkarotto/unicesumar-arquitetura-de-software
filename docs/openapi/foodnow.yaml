openapi: 3.0.3
info:
  title: FoodNow API
  version: 1.0.0
  description: Contrato das operações de pedidos com observação opcional.

servers:
  - url: http://localhost:8080
    description: Ambiente local

paths:
  /pedidos:
    post:
      operationId: criarPedido
      summary: Criar pedido
      description: Cria um pedido com pelo menos um item. A observação é opcional e não pode ser alterada depois da criação.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoRequest'
            examples:
              comObservacao:
                summary: Pedido com observação
                value:
                  clienteId: 1
                  restauranteId: 2
                  enderecoEntregaId: 3
                  itens:
                    - produtoId: 4
                      quantidade: 2
                  observacao: Não incluir talheres
              semObservacao:
                summary: Pedido sem observação (contrato anterior)
                value:
                  clienteId: 1
                  restauranteId: 2
                  enderecoEntregaId: 3
                  itens:
                    - produtoId: 4
                      quantidade: 2
      responses:
        '201':
          description: Pedido criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoResponse'
              example:
                id: 10
                clienteId: 1
                restauranteId: 2
                enderecoEntregaId: 3
                itens:
                  - produtoId: 4
                    nome: Pizza
                    quantidade: 2
                    precoUnitario: 30.00
                    subtotal: 60.00
                subtotal: 60.00
                taxaEntrega: 8.00
                valorTotal: 68.00
                distanciaEntregaKm: 2.5
                status: CRIADO
                observacao: Não incluir talheres
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '404':
          $ref: '#/components/responses/RecursoNaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraNegocio'

  /pedidos/{id}:
    get:
      operationId: consultarPedido
      summary: Consultar pedido
      parameters:
        - $ref: '#/components/parameters/PedidoId'
      responses:
        '200':
          description: Pedido encontrado. A propriedade observacao é omitida quando não foi informada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoResponse'
        '404':
          $ref: '#/components/responses/RecursoNaoEncontrado'

  /pedidos/{id}/itens:
    post:
      operationId: adicionarItemAoPedido
      summary: Adicionar item ao pedido
      parameters:
        - $ref: '#/components/parameters/PedidoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemPedidoRequest'
            example:
              produtoId: 4
              quantidade: 1
      responses:
        '200':
          description: Item adicionado e pedido atualizado; a observação original é preservada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoResponse'
        '400':
          $ref: '#/components/responses/ErroValidacao'
        '404':
          $ref: '#/components/responses/RecursoNaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraNegocio'

  /pedidos/{id}/confirmar:
    post:
      operationId: confirmarPedido
      summary: Confirmar pedido
      parameters:
        - $ref: '#/components/parameters/PedidoId'
      responses:
        '200':
          description: Pedido confirmado; a observação original é preservada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoResponse'
        '404':
          $ref: '#/components/responses/RecursoNaoEncontrado'
        '422':
          $ref: '#/components/responses/RegraNegocio'

components:
  parameters:
    PedidoId:
      name: id
      in: path
      required: true
      description: Identificador numérico do pedido.
      schema:
        type: integer
        format: int64

  responses:
    ErroValidacao:
      description: Corpo da requisição inválido ou campos fora das validações.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroResponse'
          example:
            status: 400
            erro: VALIDATION_ERROR
            mensagem: "observacao: size must be between 0 and 500"

    RecursoNaoEncontrado:
      description: Pedido, cliente, restaurante ou produto não encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroResponse'
          example:
            status: 404
            erro: NOT_FOUND
            mensagem: Pedido não encontrado

    RegraNegocio:
      description: Operação não permitida pelas regras de negócio.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErroResponse'
          example:
            status: 422
            erro: REGRA_NEGOCIO
            mensagem: "Produto indisponível: Pizza"

  schemas:
    PedidoRequest:
      type: object
      required:
        - clienteId
        - restauranteId
        - enderecoEntregaId
        - itens
      properties:
        clienteId:
          type: integer
          format: int64
        restauranteId:
          type: integer
          format: int64
        enderecoEntregaId:
          type: integer
          format: int64
        itens:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ItemPedidoRequest'
        observacao:
          type: string
          maxLength: 500
          nullable: true
          description: Campo opcional. Ausente ou null são tratados como null; string vazia é aceita e armazenada vazia.

    ItemPedidoRequest:
      type: object
      required:
        - produtoId
        - quantidade
      properties:
        produtoId:
          type: integer
          format: int64
        quantidade:
          type: integer
          minimum: 1

    ItemResponse:
      type: object
      required:
        - produtoId
        - nome
        - quantidade
        - precoUnitario
        - subtotal
      properties:
        produtoId:
          type: integer
          format: int64
        nome:
          type: string
        quantidade:
          type: integer
        precoUnitario:
          type: number
          format: double
        subtotal:
          type: number
          format: double

    PedidoResponse:
      type: object
      required:
        - id
        - clienteId
        - restauranteId
        - enderecoEntregaId
        - itens
        - subtotal
        - taxaEntrega
        - valorTotal
        - distanciaEntregaKm
        - status
      properties:
        id:
          type: integer
          format: int64
        clienteId:
          type: integer
          format: int64
        restauranteId:
          type: integer
          format: int64
        enderecoEntregaId:
          type: integer
          format: int64
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemResponse'
        subtotal:
          type: number
          format: double
        taxaEntrega:
          type: number
          format: double
        valorTotal:
          type: number
          format: double
        distanciaEntregaKm:
          type: number
          format: double
        status:
          $ref: '#/components/schemas/StatusPedido'
        observacao:
          type: string
          maxLength: 500
          description: Propriedade omitida no JSON quando o pedido não possui observação.

    StatusPedido:
      type: string
      enum:
        - CRIADO
        - CONFIRMADO
        - PAGO
        - PAGAMENTO_REJEITADO
        - EM_ENTREGA
        - ENTREGUE

    ErroResponse:
      type: object
      required:
        - status
        - erro
        - mensagem
      properties:
        status:
          type: integer
        erro:
          type: string
        mensagem:
          type: string