openapi: 3.1.0
info:
  title: FoodNow - API de pedidos
  version: 1.1.0
  license: { name: Uso acadêmico }
servers:
  - url: http://localhost:8080
security: []
paths:
  /pedidos:
    post:
      operationId: criarPedido
      summary: Criar pedido
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedidoRequest' }
            example: { clienteId: 1, restauranteId: 2, enderecoEntregaId: 3, itens: [{ produtoId: 4, quantidade: 2 }], observacao: Não incluir talheres }
      responses:
        '201': { description: Criado, content: { application/json: { schema: { $ref: '#/components/schemas/PedidoResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /pedidos/{id}:
    get:
      operationId: consultarPedido
      summary: Consultar pedido
      parameters: [{ $ref: '#/components/parameters/PedidoId' }]
      responses:
        '200': { description: Pedido, content: { application/json: { schema: { $ref: '#/components/schemas/PedidoResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /pedidos/{id}/itens:
    post:
      operationId: adicionarItem
      summary: Adicionar item preservando a observação
      parameters: [{ $ref: '#/components/parameters/PedidoId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ItemPedidoRequest' } } } }
      responses:
        '200': { description: Pedido atualizado, content: { application/json: { schema: { $ref: '#/components/schemas/PedidoResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
  /pedidos/{id}/confirmar:
    post:
      operationId: confirmarPedido
      summary: Confirmar pedido preservando a observação
      parameters: [{ $ref: '#/components/parameters/PedidoId' }]
      responses:
        '200': { description: Pedido confirmado, content: { application/json: { schema: { $ref: '#/components/schemas/PedidoResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
components:
  parameters:
    PedidoId: { name: id, in: path, required: true, schema: { type: integer, format: int64, minimum: 1 } }
  schemas:
    ItemPedidoRequest:
      type: object
      required: [produtoId, quantidade]
      properties: { produtoId: { type: integer, format: int64 }, quantidade: { type: integer, minimum: 1 } }
    PedidoRequest:
      type: object
      required: [clienteId, restauranteId, enderecoEntregaId, itens]
      properties:
        clienteId: { type: integer, format: int64 }
        restauranteId: { type: integer, format: int64 }
        enderecoEntregaId: { type: integer, format: int64 }
        itens: { type: array, minItems: 1, items: { $ref: '#/components/schemas/ItemPedidoRequest' } }
        observacao: { type: [string, 'null'], maxLength: 500, description: "Campo opcional; null, vazio e somente espaços são tratados como ausência." }
    ItemResponse:
      type: object
      required: [produtoId, nome, quantidade, precoUnitario, subtotal]
      properties:
        produtoId: { type: integer, format: int64 }
        nome: { type: string }
        quantidade: { type: integer }
        precoUnitario: { type: number }
        subtotal: { type: number }
    PedidoResponse:
      type: object
      required: [id, clienteId, restauranteId, enderecoEntregaId, itens, subtotal, taxaEntrega, valorTotal, distanciaEntregaKm, status]
      properties:
        id: { type: integer, format: int64 }
        clienteId: { type: integer, format: int64 }
        restauranteId: { type: integer, format: int64 }
        enderecoEntregaId: { type: integer, format: int64 }
        itens: { type: array, items: { $ref: '#/components/schemas/ItemResponse' } }
        subtotal: { type: number }
        taxaEntrega: { type: number }
        valorTotal: { type: number }
        distanciaEntregaKm: { type: number, format: double }
        status: { type: string, enum: [CRIADO, CONFIRMADO, PAGO, PAGAMENTO_REJEITADO, EM_ENTREGA, ENTREGUE] }
        observacao: { type: [string, 'null'], maxLength: 500 }
    ErroResponse:
      type: object
      required: [status, erro, mensagem]
      properties: { status: { type: integer }, erro: { type: string }, mensagem: { type: string } }
  responses:
    BadRequest: { description: Requisição inválida, content: { application/json: { schema: { $ref: '#/components/schemas/ErroResponse' } } } }
    NotFound: { description: Recurso não encontrado, content: { application/json: { schema: { $ref: '#/components/schemas/ErroResponse' } } } }
    UnprocessableEntity: { description: Regra de negócio violada, content: { application/json: { schema: { $ref: '#/components/schemas/ErroResponse' } } } }
